name: Daily CV waves

on:
  schedule:
    # Extra waves after the Vercel 8:00 AM Pakistan hunt (UTC+5).
    # 10:00, 12:00, 2:00, 3:00, 4:00, 6:00, 8:00 PM Pakistan time.
    - cron: "0 5,7,9,10,11,13,15 * * *"
  workflow_dispatch:

jobs:
  send-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Job Match pipeline wave
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Add CRON_SECRET in GitHub repo Settings > Secrets and variables > Actions."
            echo "Use the same value as the Vercel CRON_SECRET env var."
            exit 1
          fi
          url="${APP_URL:-https://job-match-tan.vercel.app}"
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            "$url/api/cron"
